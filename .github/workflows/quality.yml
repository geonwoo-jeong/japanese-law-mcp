name: 品質ゲート

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "17 9 * * 2"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-go:
    name: Go 1.25 最小互換性
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOENV: "off"
      GOFLAGS: "-mod=readonly"
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPRIVATE: ""
      GOPROXY: "https://proxy.golang.org"
      GOSUMDB: "sum.golang.org"
      GOTOOLCHAIN: "local"
      GOVCS: "public:git,private:off"
      GOWORK: "off"

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 最小 Go バージョンを設定する
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.0"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/gitleaks/go.sum

      - name: 製品コードの最小互換性を検証する
        run: go build -p=1 ./...

      - name: 固定済み検証ツールの最小互換性を検証する
        run: |
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/actionlint" github.com/rhysd/actionlint/cmd/actionlint
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          go build -modfile=tools/gitleaks/go.mod -o "$RUNNER_TEMP/gitleaks" github.com/zricethezav/gitleaks/v8

  verify:
    name: 静的解析・テスト・セキュリティ
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOENV: "off"
      GOFLAGS: "-mod=readonly"
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPRIVATE: ""
      GOPROXY: "https://proxy.golang.org"
      GOSUMDB: "sum.golang.org"
      GOTOOLCHAIN: "local"
      GOVCS: "public:git,private:off"
      GOWORK: "off"

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 候補再現用 Go を設定する
        id: candidate-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: 候補再現用 Go infrastructure を固定する
        id: record-candidate-go
        shell: bash
        run: |
          set -euo pipefail
          EXACT_GOROOT="$(env -i PATH="$PATH" HOME="$HOME" GOENV=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go env GOROOT)"
          EXACT_GOMODCACHE="$(env -i PATH="$PATH" HOME="$HOME" GOENV=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go env GOMODCACHE)"
          EXACT_GOCACHE="$RUNNER_TEMP/exact-candidate-go-build-cache"
          EXACT_TMPDIR="$RUNNER_TEMP/exact-candidate-go-tmp"
          for INFRASTRUCTURE_PATH in "$EXACT_GOROOT" "$EXACT_GOMODCACHE" "$EXACT_GOCACHE" "$EXACT_TMPDIR"; do
            if [[ "$INFRASTRUCTURE_PATH" != /* ||
                  "$INFRASTRUCTURE_PATH" == *$'\n'* ||
                  "$INFRASTRUCTURE_PATH" == *$'\r'* ]]; then
              echo "候補再現用 Go infrastructure path が不正です。" >&2
              exit 1
            fi
          done
          install -d -m 0700 "$EXACT_GOMODCACHE" "$EXACT_GOCACHE" "$EXACT_TMPDIR"
          if [[ ! -d "$EXACT_GOROOT" || -L "$EXACT_GOROOT" ||
                ! -f "$EXACT_GOROOT/bin/go" || -L "$EXACT_GOROOT/bin/go" ||
                ! -x "$EXACT_GOROOT/bin/go" ]]; then
            echo "候補再現用 Go toolchain が通常の実行可能 file ではありません。" >&2
            exit 1
          fi
          for INFRASTRUCTURE_PATH in "$EXACT_GOMODCACHE" "$EXACT_GOCACHE" "$EXACT_TMPDIR"; do
            if [[ ! -d "$INFRASTRUCTURE_PATH" || -L "$INFRASTRUCTURE_PATH" ]]; then
              echo "候補再現用 Go infrastructure が通常 directory ではありません。" >&2
              exit 1
            fi
          done
          EXACT_VERSION="$(env -i PATH="$EXACT_GOROOT/bin" GOROOT="$EXACT_GOROOT" GOENV=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go version)"
          if [[ "$EXACT_VERSION" != "go version go1.26.5 linux/amd64" ]]; then
            echo "候補 content manifest と Go toolchain が一致しません。" >&2
            exit 1
          fi
          {
            printf '%s=%s\n' JAPANESE_LAW_MCP_EXACT_CANDIDATE_GOROOT "$EXACT_GOROOT"
            printf '%s=%s\n' JAPANESE_LAW_MCP_EXACT_CANDIDATE_GOMODCACHE "$EXACT_GOMODCACHE"
            printf '%s=%s\n' JAPANESE_LAW_MCP_EXACT_CANDIDATE_GOCACHE "$EXACT_GOCACHE"
            printf '%s=%s\n' JAPANESE_LAW_MCP_EXACT_CANDIDATE_TMPDIR "$EXACT_TMPDIR"
          } >>"$GITHUB_ENV"

      - name: Go を設定する
        id: primary-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 製品モジュールの最小バージョンは上げず、CI の実行環境だけをパッチ版まで固定する。
          go-version: "1.26.7"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/gitleaks/go.sum

      - name: 品質ゲートのビルドキャッシュを復元する
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/japanese-law-mcp-quality-cache
          key: ${{ runner.os }}-${{ runner.arch }}-quality-go1.26.7-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/gitleaks/go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-quality-go1.26.7-

      - name: pull request のプロバイダー追加適合性を検証する
        if: github.event_name == 'pull_request'
        env:
          PROVIDER_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: go run ./cmd/provider-onboarding-fit --base-ref "$PROVIDER_BASE_REF"

      - name: push のプロバイダー追加適合性を検証する
        if: github.event_name == 'push'
        env:
          PROVIDER_BASE_REF: ${{ github.event.before }}
          PROVIDER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROVIDER_BASE_REF" =~ ^0+$ ]]; then
            if ! git check-ref-format --branch "$PROVIDER_DEFAULT_BRANCH" >/dev/null; then
              echo "新規 ref の比較元となる既定ブランチ名が不正です。" >&2
              exit 1
            fi
            PROVIDER_BASE_REF="refs/remotes/origin/${PROVIDER_DEFAULT_BRANCH}"
            if ! git rev-parse --verify "${PROVIDER_BASE_REF}^{commit}" >/dev/null; then
              echo "新規 ref の比較元となる既定ブランチを取得できませんでした。" >&2
              exit 1
            fi
          fi
          go run ./cmd/provider-onboarding-fit --base-ref "$PROVIDER_BASE_REF"

      - name: 権威ある品質ゲートを実行する
        run: go run ./cmd/quality-gate --profile=ci --repository=. --git-repository=.
