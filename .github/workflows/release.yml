name: 公式リリース

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 配布物を検証して draft を作成する
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    env:
      GOENV: "off"
      GOFLAGS: "-mod=readonly"
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPRIVATE: ""
      GOPROXY: "https://proxy.golang.org"
      GOSUMDB: "sum.golang.org"
      GOTOOLCHAIN: "local"
      GOVCS: "public:git,private:off"
      GOWORK: "off"

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Go を設定する
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/gitleaks/go.sum

      - name: リリース版を確定する
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: リリース情報を検証する
        run: >-
          go run ./cmd/release-check
          --release-notes="release-notes/${GITHUB_REF_NAME}.md"
          --tag="${GITHUB_REF_NAME}"
          --repository=.

      - name: 公開済みリリースの上書きを防ぐ
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/release-state.json"
          status="$(
            curl --silent --show-error --location \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          )"
          case "$status" in
            404)
              ;;
            200)
              if ! jq -e '.draft == true' "$response_file" >/dev/null; then
                echo "公開済みの同一 tag は上書きできません: ${GITHUB_REF_NAME}" >&2
                exit 1
              fi
              ;;
            *)
              echo "release の状態を確認できませんでした: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: 権威ある品質ゲートを実行する
        run: go run ./cmd/quality-gate --profile=ci --repository=. --git-repository=.

      - name: 公式配布物の draft を作成する
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --release-notes=release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成した配布物を検証する
        run: >-
          go run ./cmd/release-check
          --release-notes="release-notes/${GITHUB_REF_NAME}.md"
          --tag="${GITHUB_REF_NAME}"
          --repository=.
          --dist=dist
          --commit="${GITHUB_SHA}"

      - name: smoke test 用の配布物を保存する
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: ${{ matrix.os }}-${{ matrix.arch }} の実行を確認する
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    env:
      GOENV: "off"
      GOFLAGS: "-mod=readonly"
      GONOPROXY: ""
      GONOSUMDB: ""
      GOPRIVATE: ""
      GOPROXY: "https://proxy.golang.org"
      GOSUMDB: "sum.golang.org"
      GOTOOLCHAIN: "local"
      GOVCS: "public:git,private:off"
      GOWORK: "off"

    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go を設定する
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: go.sum

      - name: 配布物を取得する
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist

      - name: 新しい利用者環境で実行を確認する
        run: >-
          go run ./cmd/release-check
          --release-notes="release-notes/${{ github.ref_name }}.md"
          --tag="${{ github.ref_name }}"
          --repository=.
          --dist=dist
          --commit="${{ github.sha }}"
          --target-os="${{ matrix.os }}"
          --target-arch="${{ matrix.arch }}"

  publish:
    name: 検証済みの draft を公開する
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 公式リリースを公開する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
