version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - contextcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - ineffassign
    - nilerr
    - noctx
    - nolintlint
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        # SOT-ENG-019: G104 は errcheck と同じ未処理エラーを重複して報告する。
        - G104
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # SOT-ENG-019/SOT-ENG-038: 同値な append 代入への書換えだけで review 済み candidate content の source byte を変えない。
      - path: ^internal/queryprofile/metadataartifact/artifact\.go$
        text: "appendAssign: append result not assigned to the same slice"
        linters:
          - gocritic

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
